services:

  garagehub-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: garagehub-api
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  garagehub-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: garagehub-frontend
    ports:
      - "80:80"
    depends_on:
      garagehub-api:
        condition: service_healthy

  postgres:
    image: postgres:17
    ports:
      - "5432:5432"

    environment:
      POSTGRES_DB: garagehub
      POSTGRES_USER: garagehub
      POSTGRES_PASSWORD: garagehub123

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garagehub -d garagehub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: